name: Setup
description: Install pnpm and Node.js from package.json, then install dependencies.

runs:
    using: composite
    steps:
        - name: Install pnpm
          uses: pnpm/action-setup@v6
        - name: Install node
          uses: actions/setup-node@v7
          with:
              cache: pnpm
              node-version-file: package.json
        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
