name: Website

on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - website/**
            - docs/user-guide/**
            - README.md
    pull_request:
        paths:
            - website/**
            - docs/user-guide/**
            - README.md

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: website
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install dependencies
              uses: ./.github/actions/setup
              with:
                  working-directory: website

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Upload Pages artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: website/dist

    deploy:
        if: github.event_name != 'pull_request'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
