name: Release

on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}

permissions: {}

jobs:
    release:
        if: github.repository_owner == 'doubleloop-io'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
            pull-requests: write
            id-token: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install dependencies
              uses: ./.github/actions/setup

            - name: Upgrade npm for OIDC support
              run: npm install -g npm@11

            - name: Open or update the version pull request, or publish
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: pnpm changeset-version
                  publish-script: pnpm changeset-publish
