name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - main
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install dependencies
              uses: ./.github/actions/setup

            - name: Format
              run: pnpm format:check

            - name: Types
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Check tarball
              run: pnpm pack:check

            - name: Consumer test tarball
              run: pnpm consumer-test
